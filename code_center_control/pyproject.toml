[project]
name = "robi-center"
version = "0.1.0"
description = "Robi central control for the loading box"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1.0",
    "pyserial>=3.5",
    "starlette>=1.6.0",
    "uvicorn>=0.53.0",
    "websockets>=17.1",
]

[project.scripts]
center = "center.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["center"]

[tool.hatch.build.targets.wheel.force-include]
"center/static/monitor.html" = "center/static/monitor.html"
